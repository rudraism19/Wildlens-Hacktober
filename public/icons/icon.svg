<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09140f"/>
      <stop offset="50%" stop-color="#122a20"/>
      <stop offset="100%" stop-color="#1a3d2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Camera Aperture Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Stylized Nature Leaf -->
  <path d="M 256 120 C 330 150 370 230 350 310 C 330 390 256 400 256 400 C 256 400 182 390 162 310 C 142 230 182 150 256 120 Z"
        fill="url(#emeraldGrad)" filter="url(#glow)" />

  <!-- Leaf Central Vein / Aperture Line -->
  <path d="M 256 140 Q 256 260 256 380" stroke="#062e1e" stroke-width="8" stroke-linecap="round" />
  <path d="M 256 220 Q 290 200 315 210" stroke="#062e1e" stroke-width="6" stroke-linecap="round" />
  <path d="M 256 270 Q 220 250 195 260" stroke="#062e1e" stroke-width="6" stroke-linecap="round" />
  <path d="M 256 320 Q 285 305 310 315" stroke="#062e1e" stroke-width="6" stroke-linecap="round" />

  <!-- Lens Center Shutter Sparkle -->
  <circle cx="256" cy="256" r="14" fill="#a7f3d0" />
</svg>
